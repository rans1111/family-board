body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; background: radial-gradient(420px 340px at 8% 4%, var(--blob1), transparent 70%), radial-gradient(460px 400px at 96% 100%, var(--blob2), transparent 70%), var(--page); }

.remember { display: flex; align-items: center; gap: 8px; margin: 12px 0 16px; color: var(--ink); font-size: 15px; }
.remember input { width: 19px; height: 19px; }
button { width: 100%; font: inherit; font-weight: 700; padding: 12px; border: 0; border-radius: 12px; cursor: pointer; color: #16224a; background: linear-gradient(115deg, var(--a), var(--b) 60%, var(--c)); }
button:disabled { opacity: .6; cursor: default; }

[hidden] { display: none !important; }

<script>
'use strict';
const box = JSON.parse(document.getElementById('box').textContent);
const el = (id) => document.getElementById(id);
const bytes = (b64) => Uint8Array.from(atob(b64), (c) => c.charCodeAt(0));
const salt = bytes(box.salt), iv = bytes(box.iv), ct = bytes(box.ct);
const DB = 'board';

function db() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open(DB, 1);
    r.onupgradeneeded = () => r.result.createObjectStore('k');
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function saved(mode, value) {
  try {
    const d = await db();
    return await new Promise((resolve, reject) => {
      const s = d.transaction('k', mode).objectStore('k');
      const r = mode === 'readonly' ? s.get('key') : value ? s.put(value, 'key') : s.delete('key');
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  } catch (e) { return undefined; }
}
async function derive(password) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', hash: 'SHA-256', salt, iterations: box.iter }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
}
async function open(key) {
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
  const html = new TextDecoder().decode(plain);
  document.open();
  document.write(html);
  document.close();
}

async function start() {
  if (!window.crypto || !crypto.subtle) { el('panel').hidden = false; el('msg').textContent = 'הדפדפן הזה לא תומך בפתיחת הדף.'; return; }
  const remembered = await saved('readonly');
  if (remembered && remembered.salt === box.salt) {
    try { await open(remembered.key); return; } catch (e) { await saved('readwrite', null); }
  }
  el('panel').hidden = false;
}

el('form').addEventListener('submit', async (e) => {
  e.preventDefault();
  el('go').disabled = true;
  el('msg').textContent = '';
  try {
    const key = await derive(el('pw').value);
    await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, ct);
    if (el('remember').checked) await saved('readwrite', { salt: box.salt, key });
    await open(key);
  } catch (err) {
    el('msg').textContent = 'הסיסמה שגויה.';
    el('go').disabled = false;
    el('pw').select();
  }
});
start();
</script>
</body>
</html>
